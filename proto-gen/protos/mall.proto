syntax = "proto3";

message C2S_Mall {
  string gametype = 1; // 当前游戏类型，见游戏枚举定义
}

message S2C_Mall {
  string items = 1; // 道具列表，json 格式，具体定义和 web 一致
}

message C2S_Buy {
  string itemid = 1;  // 道具 ID
  uint32 count = 2;   // 购买数量
  string address = 3; // 邮寄地址
  string phone = 4;   // 联系电话
}

message S2C_Buy {
  string orderid = 1; // 订单 ID
}

message C2S_OrderList {}

message S2C_OrderList {
  string content = 1; // 订单列表，json 格式，具体定义和 web 一致
}
