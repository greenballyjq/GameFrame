syntax = "proto3";

// 服务端通用返回码。
enum S2COpcode {
  // 操作成功。
  OP_SUCCESS = 0;
  // 操作失败。
  OP_FAILED = 1;
  // 会话过期，需重新登录。
  OP_SESSION_EXPIRED = 2;
  // 会话令牌无效。
  OP_SESSION_TOKEN_INVALID = 3;
  // 配置不存在。
  OP_NO_CONFIGURATION = 4;
  // 参数无效。
  OP_PARAM_INVALID = 5;
  // 广告服务端验证结果未就绪，请稍后重试。
  OP_WXAD_VERIFY_PENDING = 6;
  // 广告验证重试次数超限。
  OP_WXAD_RETRY_LIMIT_EXCEEDED = 7;
  // 跳签后仅支持当日签到，补签需先看广告。
  OP_SIGNIN_RESIGN_REQUIRED = 8;
  // 该日期已签到。
  OP_SIGNIN_ALREADY_DONE = 9;

  // threekp 余额不足。
  OP_3KP_NOT_ENOUGH = 101;
  // 物品不足。
  OP_ITEM_NOT_ENOUGH = 103;
  // 商品不存在。
  OP_MALL_ITEM_NOT_EXIST = 104;
  // 商品购买数量非法。
  OP_MALL_ITEM_BUY_COUNT_ERROR = 105;
  // 商品处于购买冷却中。
  OP_MALL_ITEM_COOLDOWN = 106;
  // 该自然月内实物商品免换次数已达上限。
  OP_MALL_MONTHLY_LIMIT_EXCEEDED = 107;

  // 平台认证失败。
  OP_LOGIN_AUTH_FAILED = 1002;
}
