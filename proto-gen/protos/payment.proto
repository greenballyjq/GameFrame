syntax = "proto3";

import "opcode.proto";

// 拉取商城商品请求（空消息，商品范围由会话 game_id 决定）。
message C2SMall {}

// 拉取商城商品响应。
message S2CMall {
  // 商品列表 JSON 字符串。
  string items = 1;
}

// 下单购买请求。
message C2SBuy {
  // 商品 ID。
  string item_id = 1;
  // 购买数量。
  uint32 count = 2;
  // 收货地址。
  string address = 3;
  // 联系手机号。
  string phone = 4;
}

// 下单购买响应。
message S2CBuy {
  // 订单号。
  string order_id = 1;
}

// 查询订单列表请求（空消息）。
message C2SOrderList {}

// 查询订单列表响应。
message S2COrderList {
  // 订单列表 JSON 字符串。
  string content = 1;
}

// 支付域根请求（/payment）。
message C2SPayment {
  // 请求序号（客户端自增，服务端原样回传）。
  uint64 session = 1;
  // 具体支付子请求。
  oneof msg {
    // 拉取商城商品。
    C2SMall mall = 2;
    // 下单购买。
    C2SBuy buy = 3;
    // 查询订单列表。
    C2SOrderList order_list = 4;
  }
}

// 支付域根响应（/payment）。
message S2CPayment {
  // 对应请求的 session。
  uint64 session = 1;
  // 通用错误码（OP_SUCCESS 表示成功）。
  S2COpcode code = 99;
  // 具体支付子响应。
  oneof msg {
    // 拉取商城商品响应。
    S2CMall mall = 2;
    // 下单购买响应。
    S2CBuy buy = 3;
    // 查询订单列表响应。
    S2COrderList order_list = 4;
  }
}
