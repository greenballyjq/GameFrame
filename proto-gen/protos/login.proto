syntax = "proto3";

message WeChat {
  string code = 1; // 客户端通过 wx.login 获取
}

message TikTok {
  string code = 1; // 客户端通过 tt.login 获取
}

message C2S_Login {
  string phone = 1; // 手机账号, 三方平台登录可不填
  oneof platform {
    WeChat wechat = 2; // 微信
    TikTok tiktok = 3; // 抖音
  }
};

message S2C_Login {
  string token = 1; // 用户令牌，后续通信必须放在 header 的 "Authorization" 中
};
